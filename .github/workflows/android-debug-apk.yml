name: Android debug APK

# Manual trigger only for now - this is for sideload testing during native-call development
# (see the Capacitor + FCM + ConnectionService plan), not an auto-deploy pipeline. Also builds
# on every push that touches the Android project or web source, so a debug APK is always
# available as a workflow artifact without having to remember to trigger it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - '.env.capacitor'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (capacitor mode) + sync
        run: npm run build:android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/qrlin-safety.keystore

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: qrlin-safety.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: qrlin-safety-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
